services:
  verona-auto:
    build: .
    container_name: verona-auto
    restart: unless-stopped
    ports:
      - "127.0.0.1:5050:5050"   # exponha só via proxy HTTPS (Caddy/Nginx)
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/verona.db
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./data:/app/data            # SQLite: conversas, bloqueios, contadores
      - ./cache:/app/cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5050/health"]
      interval: 60s
      timeout: 5s
      retries: 3
